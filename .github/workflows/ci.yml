name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-matrix:
    name: unit matrix / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run complete unit suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  unit:
    name: unit
    needs: unit-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo 'unit matrix passed'

  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify parser, schema, archive, and ordering fixtures
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest -v
          tests.test_parser
          tests.test_schema_v2
          tests.test_archive_model
          tests.test_archive_cli
          tests.test_ordering
          tests.test_snapshot

  package-validation:
    name: package-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate installable package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/package_validation.py

  docs-consistency:
    name: docs-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate duplicated contract facts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/docs_consistency.py
      - name: Validate trigger contract
        run: sh tests/trigger-contract.sh

  install-smoke-matrix:
    name: install matrix / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            platform: linux
          - os: ubuntu-latest
            python: "3.x"
            platform: linux
          - os: macos-latest
            python: "3.11"
            platform: macos
          - os: macos-latest
            python: "3.x"
            platform: macos
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout and installed-package smoke
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/install_smoke.py --expect-platform ${{ matrix.platform }}

  install-smoke:
    name: install-smoke
    needs: install-smoke-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo 'install smoke matrix passed'
